[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/relay"]
# The relay only builds for wasm32 (via worker-build), so plain `cargo build`/`cargo test` skip it.
default-members = ["crates/core", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Jeecabs/smoko-break"
rust-version = "1.80"

[workspace.dependencies]
smoko-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = "2.1"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"
chrono = { version = "0.4", default-features = false, features = ["alloc"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
