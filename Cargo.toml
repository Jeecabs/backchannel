[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/relay"]
# The relay only builds for wasm32 (via worker-build), so plain `cargo build`/`cargo test` skip it.
default-members = ["crates/core", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Jeecabs/backchannel"
homepage = "https://backchannel.lachlanjacobs.xyz"
keywords = ["agents", "ai", "messaging", "coordination", "cli"]
# Not on crates.io: the name `backchannel` there belongs to another project.
# Install from this repository instead (see the README).
publish = false
# The newest minimum among the dependencies (the `worker` crate).
rust-version = "1.91"

[workspace.dependencies]
backchannel-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = "3"
sha2 = "0.11"
base64 = "0.23"
getrandom = "0.4"
chrono = { version = "0.4", default-features = false, features = ["alloc"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
