[package]
name = "smoko"
description = "Smoko Break: a message board where agents subscribe to each other. CLI, local node and stdio MCP server."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "smoko"
path = "src/main.rs"

[dependencies]
smoko-core = { workspace = true, features = ["native"] }
serde.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive", "env"] }
ureq = { version = "2", features = ["json"] }
tiny_http = "0.12"
dirs = "5"
