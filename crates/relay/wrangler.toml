name = "backchannel"
main = "build/worker/shim.mjs"
compatibility_date = "2026-10-01"

# `npx wrangler deploy` with this file as it stands puts the relay on your
# account's *.workers.dev address, and `npx wrangler dev` runs it locally.
# To serve it on your own domain, add an environment like the one at the
# bottom of this file and deploy with `--env <name>`.

[build]
command = "worker-build --release"

[[durable_objects.bindings]]
name = "BACKCHANNEL"
class_name = "Backchannel"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Backchannel"]

# Rate limits for the endpoints anyone can call without a token, counted per
# client address. The numbers are yours to change; `period` is 10 or 60 seconds.
# `namespace_id` is any whole number, as a string, that no other rate limiter on
# your Cloudflare account uses. Delete a block and that endpoint is not limited:
# the relay skips a limiter it doesn't have.
#
# Claiming an org (POST /v1/orgs): 3 a minute.
[[ratelimits]]
name = "ORG_LIMITER"
namespace_id = "1001"
simple = { limit = 3, period = 60 }

# Joining with an invite or asking to join (POST /v1/signup): 10 a minute.
[[ratelimits]]
name = "SIGNUP_LIMITER"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

# Testing a code (GET /v1/invite/<code>, a signup that carries an invite code,
# and POST /v1/signin with a sign-in code): 20 a minute. Joining through the join page tests its code twice, once
# to show which org it opens and once to join, so this allows the same ten
# joins a minute as the limiter above.
[[ratelimits]]
name = "INVITE_LIMITER"
namespace_id = "1003"
simple = { limit = 20, period = 60 }

# Images and CLI binaries for the site. Requests that match a file here are served
# directly; everything else goes to the worker.
[assets]
directory = "../../viewer/static"

# The hosted relay at backchannel.lachlanjacobs.xyz. Deployed with
# `npx wrangler deploy --env production`. The route lives here, not at the top
# level, so local development and other people's deployments never take this
# hostname as their own. For your own domain, copy this block under a name of
# your choosing and change the pattern.
#
# `name` is set so this environment is the same Worker (and the same Durable
# Object storage) as a plain deploy; without it wrangler would create a second
# Worker called backchannel-production with empty storage.
[env.production]
name = "backchannel"
routes = [{ pattern = "backchannel.lachlanjacobs.xyz", custom_domain = true }]

# Bindings are not inherited by environments, so the Durable Object is named again.
[[env.production.durable_objects.bindings]]
name = "BACKCHANNEL"
class_name = "Backchannel"

# Rate limiters are bindings too. Keep these the same as the ones above.
[[env.production.ratelimits]]
name = "ORG_LIMITER"
namespace_id = "1001"
simple = { limit = 3, period = 60 }

[[env.production.ratelimits]]
name = "SIGNUP_LIMITER"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

[[env.production.ratelimits]]
name = "INVITE_LIMITER"
namespace_id = "1003"
simple = { limit = 20, period = 60 }
