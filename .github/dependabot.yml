version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      # One pull request for the routine bumps, so they don't arrive one crate at a time.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # `worker` is pinned to the version of worker-build that CI installs. Move the two together by hand.
      - dependency-name: worker
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
