name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release -p backchannel
      - name: Check the installer
        run: scripts/test-install.sh
      - name: Build the relay for Workers
        run: |
          cargo install worker-build --version 0.8.7 --locked
          cd crates/relay && worker-build --release

  # The Claude Code mod is TypeScript, checked against Claude Code's plugin API.
  # A job of its own, outside the required `test` check: that API is early
  # access, and the check downloads its declarations.
  mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: scripts/check-mod.sh
